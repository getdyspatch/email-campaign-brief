# Build and deploy the marketing site (Hugo + Doks) in docs/ to GitHub Pages.
# Requires repo Settings → Pages → Source = "GitHub Actions".
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions for the GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1 # Hugo extended; Doks needs a recent version
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js # Doks requires Node >= 24.13; .nvmrc pins the version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        working-directory: docs
        run: npm ci
      - name: Build with Hugo
        working-directory: docs
        env:
          HUGO_ENVIRONMENT: production
          BASEURL: ${{ steps.pages.outputs.base_url }}
        run: hugo --minify --gc --baseURL "$BASEURL/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
